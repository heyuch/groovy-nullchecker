// One-line integration: the plugin adds a `nullcheck` task.
//
// A version is REQUIRED in the plugins block. Resolving a plugin from a plugin repository
// (mavenLocal) without one fails with Gradle's "plugin dependency must include a version
// number" -- which reads like the plugin is missing, when the real problem is the missing
// version. Publish first with:
//   ./gradlew publishToMavenLocal
plugins {
    id 'groovy'
    id 'io.github.heyuch.groovy-nullchecker' version '0.7.2'
}

repositories {
    // The checker is resolved as a normal dependency by the plugin's task, so the
    // repository holding it must be visible to THIS project (settings-level repositories
    // are ignored once a project declares its own).
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation 'org.apache.groovy:groovy:4.0.30'
}

nullcheck {
    // Report-only by default: findings make the task exit 1 but do not fail the build.
    // Flip this on once the existing findings are dealt with:
    //   failOnError = true
    //
    // Other knobs, all optional:
    //   strict      = true                         // also analyse unannotated code
    //   targets     = ['src/main/groovy', 'src/main/java']
    //   toolVersion = '0.7.2'
}
