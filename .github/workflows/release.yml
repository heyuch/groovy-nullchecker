name: Release

# Driven by publishing a GitHub Release rather than by pushing a tag: the release is the
# moment a human decided the artefacts are worth keeping, and coordinates on Central are
# permanent, so the trigger has to be something deliberate.
on:
  release:
    types: [published]
  # Lets a run be retried by hand after a partial failure. The version it publishes is read
  # from gradle.properties, not from the branch name.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # The signing key and the Central token live on this environment, which is restricted to
    # v* tags. A job that does not declare the environment receives empty strings for those
    # secrets rather than an error, so this line is what actually gates them.
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          # A release event checks out the default branch unless told otherwise, which would
          # publish whatever version happens to be on main instead of the released one.
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # The tag still has to agree with the published version. The other half of what this step
      # used to compare -- gradle.properties against a version hardcoded in the plugin's own
      # build.gradle -- is gone with the duplication it guarded: both modules read the same
      # property now, so they cannot disagree.
      - name: Check the tag matches the declared version
        run: |
          declared="$(sed -n 's/^nullcheckerVersion=//p' gradle.properties)"
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$declared" ]; then
              echo "::error::tag '$tag' does not match the declared version '$declared'"
              exit 1
            fi
          fi
          echo "releasing $declared"

      # Both halves of the gate: the checker's corpus gate and the plugin's TestKit functional
      # tests. functionalTest installs the checker into ~/.m2 itself, so nothing needs staging
      # beforehand.
      - name: Check
        run: ./gradlew check

      # One upload covers the checker, the plugin and its marker: NMCP aggregates every
      # publication of the build into a single bundle.
      - name: Publish to Maven Central
        run: ./gradlew publishAggregationToCentralPortal
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          # The names on the left are what the build reads; the ones on the right are what
          # the release environment stores. They differ, which is worth stating rather than
          # leaving for the next person to rediscover: the build resolves MAVEN_GPG_*, and
          # this mapping is the only place that bridges to the secret names.
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # The Portal reviews first submissions by hand. Days of silence here are expected, not
      # a failure -- check the plugin's status page before re-running anything.
      - name: Publish the plugin to the Gradle Plugin Portal
        run: ./gradlew :nullchecker-gradle-plugin:publishPlugins
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
