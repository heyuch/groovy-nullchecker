name: CI

on:
  push:
  pull_request:

# Supersede runs on the same branch: these are the slow part of a change, and only the newest
# commit's result is worth waiting for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # The checker's unit/corpus tests and the plugin's TestKit functional tests. functionalTest
      # installs the checker into ~/.m2 itself, so a fresh runner needs no prior publish.
      - name: Unit, corpus and functional tests
        run: ./gradlew :nullchecker:test :nullchecker-gradle-plugin:functionalTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            nullchecker/build/test-results/test/
            nullchecker/build/reports/tests/test/
            nullchecker-gradle-plugin/build/test-results/functionalTest/
            nullchecker-gradle-plugin/build/reports/tests/functionalTest/
          if-no-files-found: warn

  compat:
    name: compat (${{ matrix.groovy }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        groovy: ['5.0.2', '6.0.0']
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # Exact per-fixture CorpusGate under an experimental compiler. Test classes stay on the
      # Groovy 4 toolchain; the script rebuilds main sources and support stubs for the matrix
      # version and excludes Spock/JUnit so their global transforms cannot run under 5/6.
      - name: Run compatibility corpus gate
        run: ./tools/groovy-compat-check.sh ${{ matrix.groovy }}

  check:
    name: check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # The test job owns the test suites. This job keeps the static/quality gates: CodeNarc,
      # SpotBugs (including test bytecode), Spotless, the corpus-driven dogfood run and the
      # plugin functional task's dependencies. Excluding the suites keeps the two jobs from
      # doing the same work twice.
      - name: Check static and quality gates
        run: ./gradlew check -x test -x functionalTest

      # Not part of `check` because it needs the Groovy 6 reference implementation. It is
      # an informational comparison: the port intentionally evolves beyond upstream, so
      # differences are uploaded for inspection but do not fail the build.
      - name: Dual run against Groovy 6's checker
        run: ./gradlew dualRun

      - name: Upload the dual-run reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dual-run-reports
          path: nullchecker/build/reports/dual-run/
          if-no-files-found: ignore
