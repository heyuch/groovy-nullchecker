// nullchecker —— 根聚合工程
//
// 本工程【不含源码】，只提供两个平级子模块共用的坐标与仓库配置：
//
//   :nullchecker                 checker 本体（src/、corpus/、tools/ 都在它下面）
//   :nullchecker-gradle-plugin   把 checker 接进构建的 Gradle 插件
//
// 改用子模块而非 includeBuild 的理由，见 settings.gradle 里那段说明。

// 根工程【自己】也需要一个仓库：NMCP 的聚合任务要解析 com.gradleup.nmcp:nmcp-tasks，
// 而那个 configuration 挂在根工程上（聚合任务就在根工程）。
// 之前只在 subprojects 里声明仓库，于是 check / publishToMavenLocal 全都正常，
// 唯独真正发布的那一条 `publishAggregationToCentralPortal` 在最后一步失败：
//   Cannot resolve external dependency com.gradleup.nmcp:nmcp-tasks:1.6.2
//     because no repositories are defined
// 第一次 release 就撞在这里。加 this 而不是并进 subprojects，是因为需要的正是根工程。
plugins {
    id 'com.diffplug.spotless' version '8.10.4' apply false
}

repositories {
    mavenCentral()
}

// 注意是 subprojects 而不是 allprojects：根工程不产出任何构件，也【不能】带上 group。
// 根工程与 checker 模块现在同名（模块目录名 nullchecker），一旦连 group 也一致，
// 被包含构建的自动依赖替换就会匹配到根工程而不是 :nullchecker，解析时以
// "Unable to find a matching variant ... No variants exist" 硬失败
// （functionalTest 的第一版就是这么挂的）。不带 group 则匹配不上，替换不会发生。
subprojects {
    // 版本号的【唯一来源】。
    // 此前 checker 读 gradle.properties、插件在 build.gradle 里写死，两处必须手工保持一致；
    // docs/PUBLISHING.md 曾把这条标为待还的债。同一个构建里两个模块都读这里，不一致就不可能发生。
    group = project.property('projectGroup')
    version = project.property('nullcheckerVersion')

    repositories {
        mavenCentral()
    }
}

// ── 文档里的当前版本 ──────────────────────────────────────────────────────
//
// README/examples 必须展示当前版本，而版本号的唯一来源是 gradle.properties。
// syncDocsVersion rewrites those references; checkDocsVersion (wired into check)
// fails when a release was prepared without running it. CHANGELOG and BACKLOG
// are deliberately excluded: their versions are historical facts.
def currentVersion = project.property('nullcheckerVersion').toString()
def versionedDocs = [
        'README.md',
        'README.zh-CN.md',
        'docs/PUBLISHING.md',
        'examples/consumer-plugin-demo/README.md',
        'examples/consumer-plugin-demo/build.gradle',
        'examples/consumer-strict-demo/README.md',
        'examples/consumer-strict-demo/build.gradle',
]
def versionPatterns = [
        [regex: /(io\.github\.heyuch:groovy-nullchecker:)\d+\.\d+\.\d+/, replacement: '$1' + currentVersion],
        [regex: /(io\.github\.heyuch\.groovy-nullchecker:)\d+\.\d+\.\d+/, replacement: '$1' + currentVersion],
        [regex: /(groovy-nullchecker-)\d+\.\d+\.\d+(?=(?:-sources|-javadoc)?\.jar)/, replacement: '$1' + currentVersion],
        [regex: /(nullchecker-)\d+\.\d+\.\d+(?=\.(?:jar|pom|module))/, replacement: '$1' + currentVersion],
        [regex: /(id 'io\.github\.heyuch\.groovy-nullchecker' version ')\d+\.\d+\.\d+(')/, replacement: '$1' + currentVersion + '$2'],
        [regex: /(toolVersion\s*=\s*')\d+\.\d+\.\d+(')/, replacement: '$1' + currentVersion + '$2'],
]
def renderDocVersions = { String text ->
    String result = text
    versionPatterns.each { Map pattern ->
        result = result.replaceAll((String) pattern.regex, (String) pattern.replacement)
    }
    return result
}

tasks.register('syncDocsVersion') {
    group = 'documentation'
    description = 'Rewrite the current version in README/examples from gradle.properties'
    doLast {
        List<String> changed = []
        versionedDocs.each { String path ->
            File file = rootProject.file(path)
            if (!file.isFile()) {
                return
            }
            String original = file.getText('UTF-8')
            String updated = renderDocVersions(original)
            if (updated != original) {
                file.setText(updated, 'UTF-8')
                changed.add(path)
            }
        }
        if (changed) {
            logger.lifecycle("syncDocsVersion: updated ${changed.join(', ')} (${currentVersion})")
        } else {
            logger.lifecycle("syncDocsVersion: already current (${currentVersion})")
        }
    }
}

tasks.register('checkDocsVersion') {
    group = 'verification'
    description = 'Fails when README/examples still reference a different version'
    doLast {
        List<String> stale = []
        versionedDocs.each { String path ->
            File file = rootProject.file(path)
            if (!file.isFile()) {
                return
            }
            String original = file.getText('UTF-8')
            if (renderDocVersions(original) != original) {
                stale.add(path)
            }
        }
        if (stale) {
            throw new GradleException(
                    "docs version is stale; run ./gradlew syncDocsVersion: ${stale.join(', ')}")
        }
        logger.lifecycle("checkDocsVersion: current (${currentVersion})")
    }
}

// ── 发布用的分发目录 ──────────────────────────────────────────────────────
//
// 把 release 要附带的文件集中到一个目录，文件名直接说清楚它是什么、怎么用。
// 动机：GitHub Release 自动提供的只有源码 zip，而使用者想要的是能直接用的构件 ——
// 一个含 class 的 jar。签名用的 .asc 与 .module 元数据不在这里：它们只对从 Maven
// 仓库解析的消费者有意义，附在 Release 上只会让人以为可以手工丢进 classpath。
//
// 两个 jar 的用途不同，文件名据此命名：
//   groovy-nullchecker-<v>.jar   放到【项目编译 classpath】上即可用（见 README 的 route B/C）
//   nullchecker-gradle-plugin-*.jar 单独一个 jar 无法 import：Gradle 需要有仓库里的
//                                    plugin marker。它列在这里是为了让"此版本发布了哪些构件"
//                                    在 Release 页面上是完整的；要装它请用插件 id。
tasks.register('dist') {
    group = 'distribution'
    description = 'Collects the artifacts to attach to a GitHub Release into build/dist'
    dependsOn ':nullchecker:assemble', ':nullchecker-gradle-plugin:assemble'

    def version = project.property('nullcheckerVersion').toString()
    def outputDir = layout.buildDirectory.dir('dist')

    doLast {
        File dir = outputDir.get().asFile
        delete(dir)
        dir.mkdirs()
        def libs = [
                ':nullchecker'              : ["groovy-nullchecker-${version}"],
                ':nullchecker-gradle-plugin': ["nullchecker-gradle-plugin-${version}"],
        ]
        libs.each { String path, List<String> baseNames ->
            File libsDir = project.findProject(path).layout.buildDirectory.dir('libs').get().asFile
            baseNames.each { String base ->
                ['', '-sources', '-javadoc'].each { String suffix ->
                    File src = new File(libsDir, "${base}${suffix}.jar")
                    if (!src.isFile()) {
                        throw new GradleException("dist: expected artifact is missing: ${src}")
                    }
                    // The bare jar keeps its published name so it is obvious which coordinate
                    // it corresponds to; the classifiers say what they are.
                    String name = suffix ? "${base}${suffix}.jar" : "${base}.jar"
                    copy { from src; into dir; rename { name } }
                }
            }
        }
        logger.lifecycle("dist: ${dir.listFiles().sort { it.name }*.name.join(', ')}")
        logger.lifecycle("dist: in ${dir}")
    }
}
