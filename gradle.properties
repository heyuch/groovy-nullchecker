# ── Maven 坐标 ──
projectGroup=io.github.heyuch
nullcheckerVersion=0.1.0

# ── 编译用 Groovy（本库只支持 Groovy 4.0.x）──
# 产物用 4.0.30 编译；实测同一份产物在 4.0.24 上同样正常，
# 所以 compileOnly 接受调用方自己的 4.0.x。
groovyVersion=4.0.30

# ── 对照用 Groovy 6（只在 dualRun 任务里出现，绝不进入任何编译/运行 classpath）──
# 见 PORT.md 的 "Behavioural comparison with upstream"：同一套语料在 4 与 6 下各跑一遍。
referenceGroovyVersion=6.0.0

# 测试框架：Spock 的 Groovy 4 发行线
spockVersion=2.3-groovy-4.0
